services:
  web:
    image: house-rental:dev
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      DOCKER_POLLING: "true"
    volumes:
      - ./src:/app/src:ro
      - ./public:/app/public:ro
      - ./index.html:/app/index.html:ro
      - ./vite.config.ts:/app/vite.config.ts:ro
